<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/cart.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/cart.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Handleliste</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { font-size: 20px; }
  .wrap { max-width: 720px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; height: 100%; }
  .add { display: flex; gap: 10px; padding: 0 16px 12px; flex: none; }
  .add input { flex: 1; min-height: 60px; border-radius: 30px; border: 0; padding: 0 22px; font-size: 22px; background: var(--card); color: var(--text); user-select: text; -webkit-user-select: text; }
  .list { flex: 1; overflow-y: auto; padding: 0 16px 24px; }
  .item { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 18px; padding: 10px 10px 10px 16px; margin-bottom: 10px; min-height: 68px; }
  .item .chk { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 3px solid var(--accent); display: grid; place-items: center; font-size: 26px; background: transparent; color: #1c1410; }
  .item.done .chk { background: var(--good); border-color: var(--good); }
  .item .txt { flex: 1; text-align: left; background: none; font-size: 22px; line-height: 1.2; padding: 6px 0; }
  .item.done .txt { text-decoration: line-through; opacity: .5; }
  .item small { display: block; color: var(--muted); font-size: 15px; margin-top: 3px; }
  .item .q { color: var(--accent2); font-weight: 700; }
  .item .del { flex: none; width: 52px; height: 52px; border-radius: 14px; background: transparent; color: var(--muted); font-size: 24px; }
  .utag { flex: none; color: #fff; font-size: 14px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
  .sync { display: flex; align-items: center; gap: 8px; padding: 0 20px 8px; color: var(--muted); font-size: 16px; flex: none; }
  .sync i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .who { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; flex: none; }
  .who .chip { min-height: 48px; font-size: 19px; padding: 0 18px; }
  .sec { color: var(--muted); font-size: 16px; text-transform: uppercase; letter-spacing: .6px; margin: 14px 4px 8px; }
  .foot { display: flex; gap: 10px; padding: 8px 16px 16px; flex: none; }
  .foot .btn { flex: 1; min-height: 60px; font-size: 20px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
